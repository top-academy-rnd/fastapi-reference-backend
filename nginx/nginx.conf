user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;

    # 1. Автоматический редирект с HTTP (80) на HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name lab-frontend.mymaterials.ru lab-backend.mymaterials.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Конфигурация для FRONTEND (HTTPS)
server {
    listen 443 ssl;
    server_name lab-frontend.mymaterials.ru;

    # Пути к сертификатам Certbot
    ssl_certificate /etc/letsencrypt/live/lab-frontend.mymaterials.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab-frontend.mymaterials.ru/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $target_frontend http://frontend:5173;
        proxy_pass $target_frontend;
    }
}

# 3. Конфигурация для BACKEND (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lab-backend.mymaterials.ru;

    # Пути к сертификатам Certbot
    ssl_certificate /etc/letsencrypt/live/lab-backend.mymaterials.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab-backend.mymaterials.ru/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $target_backend http://web-server:8000;
        proxy_pass $target_backend;
    }
}

}
