user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;

    # 1. Автоматический редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        listen [::]:80;
        # Укажите здесь ваш единый домен
        server_name lab-frontend.mymaterials.ru;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Единая конфигурация HTTPS с маршрутизацией по префиксу
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        # Укажите здесь ваш единый домен
        server_name lab-frontend.mymaterials.ru;

        # Пути к SSL-сертификатам для выбранного домена
        ssl_certificate /etc/letsencrypt/live/lab-frontend.mymaterials.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lab-frontend.mymaterials.ru/privkey.pem;

        resolver 127.0.0.11 valid=10s ipv6=off;

        # БЭКЕНД: Все запросы, начинающиеся с /api
        location /api/ {
            set $target_backend http://web-server:8000;
            proxy_pass $target_backend;
        }

        # ФРОНТЕНД: Все остальные запросы
        location / {
            set $target_frontend http://frontend:5173;
            proxy_pass $target_frontend;
        }
    }
}
